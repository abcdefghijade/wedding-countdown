<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:18px;
    background:transparent;
    color:#222;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
}

.countdowns{
    display:flex;
    gap:18px;
    width:100%;
}

.countdown{
    flex:1;

    border:1px solid #ececec;
    border-radius:12px;

    background:white;

    min-height:110px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:22px;
}

.event-name{
    font-size:17px;
    font-weight:600;
    margin-bottom:12px;
}

.message{
    font-size:15px;
    color:#555;
}

@media(max-width:700px){

.countdowns{
    flex-direction:column;
}

}

</style>

</head>

<body>

<div class="countdowns">

<div class="countdown">
<div class="event-name">
Wedding
</div>

<div class="message" id="wedding"></div>
</div>

<div class="countdown">
<div class="event-name">
Banquet Reception
</div>

<div class="message" id="banquet"></div>
</div>

<div class="countdown">
<div class="event-name">
Italy Elopement
</div>

<div class="message" id="italy"></div>
</div>

</div>

<script>

const events=[

{
id:"wedding",
name:"wedding",
date:"2027-06-12"
},

{
id:"banquet",
name:"Chinese banquet",
date:"2027-06-27"
},

{
id:"italy",
name:"Italy elopement",
date:"2027-08-02"
}

];

function countdown(event){

const today=new Date();
today.setHours(0,0,0,0);

const target=new Date(event.date+"T00:00:00");

const diff=Math.round((target-today)/(1000*60*60*24));

if(diff>1){
return `💍 ${diff} days to go`;
}

if(diff===1){
return "💍 1 day to go";
}

if(diff===0){
return `🎉 Today's the ${event.name}!`;
}

return "✓ Celebration complete";

}

events.forEach(event=>{
document.getElementById(event.id).textContent=countdown(event);
});

</script>

</body>
</html>
