<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    padding:18px;
    background:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#222;
    -webkit-font-smoothing:antialiased;
}

.countdowns{
    display:flex;
    gap:18px;
}

.card{

    flex:1;

    min-height:110px;

    border:1px solid #e8e8e8;
    border-radius:12px;

    background:white;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

}

.title{

    font-size:16px;
    font-weight:600;

    margin-bottom:12px;

    text-align:center;

}

.count{

    display:flex;
    align-items:center;
    justify-content:center;

    gap:7px;

    font-size:15px;
    color:#555;

}

.icon{

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:16px;
}

@media(max-width:700px){

.countdowns{

    flex-direction:column;

}

}

</style>

</head>

<body>

<div class="countdowns">

<div class="card">

<div class="title">
Wedding
</div>

<div class="count">
<span class="icon">💍</span>
<span id="wedding"></span>
</div>

</div>

<div class="card">

<div class="title">
Banquet Reception
</div>

<div class="count">
<span class="icon">💍</span>
<span id="banquet"></span>
</div>

</div>

<div class="card">

<div class="title">
Italy Elopement
</div>

<div class="count">
<span class="icon">💍</span>
<span id="italy"></span>
</div>

</div>

</div>

<script>

const events=[

{
id:"wedding",
name:"wedding",
date:"2027-06-12"
},

{
id:"banquet",
name:"Chinese banquet",
date:"2027-06-27"
},

{
id:"italy",
name:"Italy elopement",
date:"2027-08-02"
}

];

function countdown(event){

const today=new Date();
today.setHours(0,0,0,0);

const target=new Date(event.date+"T00:00:00");

const diff=Math.round((target-today)/(1000*60*60*24));

if(diff>1){
return `${diff} days to go`;
}

if(diff===1){
return "1 day to go";
}

if(diff===0){
return "Today's the big day!";
}

return "Celebration complete";

}

events.forEach(event=>{

document.getElementById(event.id).textContent=countdown(event);

});

</script>

</body>
</html>
