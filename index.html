<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: transparent;
      color: #222222;
      font-family: Arial, Helvetica, sans-serif;
    }

    .countdowns {
      display: flex;
      gap: 18px;
      width: 100%;
    }

.countdown {
  flex: 1;
  padding: 10px 14px;
  background: transparent;
    }

    .event-name {
      margin-bottom: 7px;
      font-size: 15px;
      font-weight: 600;
    }

    .message {
      font-size: 15px;
      line-height: 1.4;
    }

    @media (max-width: 650px) {
      .countdowns {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="countdowns">

    <div class="countdown">
      <div class="event-name">Wedding</div>
      <div class="message" id="wedding"></div>
    </div>

    <div class="countdown">
      <div class="event-name">Banquet Reception</div>
      <div class="message" id="banquet"></div>
    </div>

    <div class="countdown">
      <div class="event-name">Italy Elopement</div>
      <div class="message" id="italy"></div>
    </div>

  </div>

  <script>
    const events = [
      {
        id: "wedding",
        name: "wedding",
        date: "2027-06-12"
      },
      {
        id: "banquet",
        name: "banquet reception",
        date: "2027-06-27"
      },
      {
        id: "italy",
        name: "Italy elopement",
        date: "2027-08-02"
      }
    ];

    function getCountdown(event) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const target = new Date(event.date + "T00:00:00");
      const millisecondsPerDay = 1000 * 60 * 60 * 24;
      const daysLeft = Math.round((target - today) / millisecondsPerDay);

      if (daysLeft > 1) {
        return `💍 ${daysLeft} days to go`;
      }

      if (daysLeft === 1) {
        return "💍 1 day to go";
      }

      if (daysLeft === 0) {
        return `🎉 Today’s the ${event.name}!`;
      }

      return "✓ Completed";
    }

    events.forEach((event) => {
      document.getElementById(event.id).textContent = getCountdown(event);
    });
  </script>
</body>
</html>
